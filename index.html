    .blog-prose p { font-size: 13.5px; line-height: 1.9; letter-spacing: 0.02em; margin-bottom: 1.35rem; color: #222222; word-break: break-word; }
    @media (min-width: 640px) { .blog-prose p { font-size: 14.5px; line-height: 1.95; } }

    @media (min-width: 640px) { .portrait-float { width: 210px; max-width: 210px; margin-right: 1.5rem; margin-bottom: 0.85rem; } }

    .relay-table th, .relay-table td { border: 1px solid #E5E7EB; padding: 0.75rem 0.5rem; font-size: 12.5px; line-height: 1.45; }
    @media (min-width: 640px) { .relay-table th, .relay-table td { padding: 0.85rem 0.75rem; font-size: 13.5px; } }
    .relay-table th { background-color: #FAFAFA; font-weight: 700; color: #111111; text-align: center; }
    .clearfix::after { content: ""; display: table; clear: both; }
    .view-fade { animation: fadeIn 0.22s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

                <text x="58" y="147" transform="rotate(11 58 147)">M</text>
                <text x="77" y="151.5" transform="rotate(6 77 151.5)">A</text>

                <text x="123" y="155" transform="rotate(-2 123 155)">I</text>

          </svg>
        </div>
        <div class="leading-tight">
          <div class="text-[10px] sm:text-xs font-bold text-zinc-600 tracking-wider">駒澤大学オーストラリアンフットボール部</div>
          <div class="font-display text-base sm:text-xl font-bold text-zinc-950 tracking-wide uppercase group-hover:text-collegiate-purple transition-colors">KOMAZAWA UNIV. MAGPIES</div>
        </div>
      </a>

      <button id="header-back-btn" type="button" class="hidden items-center gap-1 px-3 py-1.5 rounded-sm border border-collegiate-purple text-collegiate-purple hover:bg-collegiate-purple hover:text-white text-xs font-bold transition-colors cursor-pointer">
        <span>← 一覧へ</span>
      </button>
    </div>

  <main class="flex-1 w-full max-w-3xl mx-auto bg-white shadow-[0_0_20px_rgba(0,0,0,0.03)] px-5 sm:px-10 pt-8 pb-20">
    <section id="index-view" class="view-fade">
      <hr class="collegiate-rule mb-5" />
      <div class="flex items-center gap-3 mb-3">
        <time datetime="2026-11-25" class="text-sm sm:text-base font-medium text-zinc-800 tracking-wide">2026.11.25</time>
        <span class="inline-block bg-collegiate-purple text-white text-xs font-bold px-3.5 py-0.5 rounded-sm tracking-wider">特集</span>
      </div>
      <h1 class="text-lg sm:text-xl font-bold text-zinc-950 leading-snug tracking-tight mb-4">2026年度ブログリレー〜4年生の想い〜</h1>
      <hr class="collegiate-rule mb-7" />

      <div class="mb-7">
        <div class="overflow-hidden rounded-sm border border-zinc-200 bg-zinc-100">
          <div id="team-hero-placeholder" class="aspect-[4/3] sm:aspect-[16/10] w-full bg-gradient-to-br from-zinc-900 via-[#221133] to-black text-white flex flex-col items-center justify-center p-6 text-center relative overflow-hidden">
            <div class="absolute inset-4 border border-white/15 rounded-sm pointer-events-none"></div>
            <p class="font-display text-sm sm:text-base tracking-widest uppercase text-purple-200 mb-1">KOMAZAWA MAGPIES 4TH GRADE</p>
            <p class="text-xs text-zinc-300">2026 SEASON RETIREMENT BLOG RELAY</p>
          </div>
          <img id="team-hero-img" src="" alt="駒澤大学マグパイズ 4年生集合写真" class="hidden w-full h-auto object-cover" />
        </div>
      </div>

      <div class="text-[13.5px] sm:text-sm leading-[1.85] text-zinc-800 space-y-3 mb-8">
        <p>2026年12月より、4年生によるブログリレーを行います。</p>
        <p>4年間の想いが詰まった熱いブログを是非ご覧ください。</p>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full border-collapse relay-table">
          <thead>
            <tr>
              <th class="w-[22%]">日付</th>
              <th class="w-[33%]">名前</th>
              <th class="w-[45%]">タイトル<span class="block sm:inline text-[11px] font-normal text-zinc-500">（タップで記事を開く）</span></th>
            </tr>
          </thead>
          <tbody id="relay-table-body"></tbody>
        </table>
      </div>
    </section>

    <section id="article-view" class="hidden view-fade">
      <article>
        <hr class="collegiate-rule mb-5" />
        <div class="flex items-center gap-3 mb-3">
          <time id="detail-date" class="text-sm sm:text-base font-medium text-zinc-800 tracking-wide">2026.11.25</time>
          <span class="inline-block bg-collegiate-slateBadge text-white text-xs font-bold px-3.5 py-0.5 rounded-sm tracking-wider">引退ブログ</span>
        </div>
        <h2 id="detail-title" class="text-lg sm:text-xl font-bold text-zinc-950 leading-snug tracking-tight mb-4"></h2>
        <hr class="collegiate-rule mb-7" />

        <div class="blog-prose clearfix">
          <div id="detail-photo-wrapper" class="portrait-float">
            <div class="overflow-hidden rounded-sm border border-zinc-200 bg-zinc-100">
              <img id="detail-photo" src="" alt="個人写真" class="w-full aspect-[3/4] object-cover object-center" />
            </div>
          </div>
          <div id="detail-body"></div>
        </div>
      </article>

      <hr class="collegiate-rule mt-12 mb-8" />

      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <button id="prev-article-btn" type="button" class="px-3 py-2.5 rounded-sm border border-zinc-300 bg-zinc-50 hover:bg-zinc-100 text-zinc-800 text-xs font-bold text-left truncate disabled:opacity-30 disabled:pointer-events-none cursor-pointer">← 前の記事</button>
          <button id="next-article-btn" type="button" class="px-3 py-2.5 rounded-sm border border-zinc-300 bg-zinc-50 hover:bg-zinc-100 text-zinc-800 text-xs font-bold text-right truncate disabled:opacity-30 disabled:pointer-events-none cursor-pointer">次の記事 →</button>
        </div>
        <div class="flex justify-center pt-2">
          <button id="bottom-back-btn" type="button" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-8 py-3 rounded-sm bg-collegiate-purple hover:bg-collegiate-purpleDark text-white text-xs sm:text-sm font-bold shadow-sm transition-colors cursor-pointer">
            <span>ブログリレー目次（一覧）へ戻る</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="max-w-3xl w-full mx-auto py-6 px-5 text-center text-[11px] text-zinc-500">
    &copy; 2026 KOMAZAWA UNIV. MAGPIES. All Rights Reserved.
  </footer>

  <script>
    let blogState = { heroPhoto: "", articles: [] };

    function formatFullDate(dateStr) {
      const s = String(dateStr || "").trim();
      if (!s) return "2026.11.25";
      return s.includes("2026") ? s.replace(/\//g, ".") : `2026.${s.replace(/\//g, ".")}`;
    }

    function escapeHtml(str) {
      return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function renderAll() {
      const heroImg = document.getElementById("team-hero-img");
      const heroPh = document.getElementById("team-hero-placeholder");
      if (blogState.heroPhoto) {
        heroImg.src = blogState.heroPhoto;
        heroImg.classList.remove("hidden");
        heroPh.classList.add("hidden");
      } else {
        heroImg.classList.add("hidden");
        heroPh.classList.remove("hidden");
      }

      const tbody = document.getElementById("relay-table-body");
      tbody.innerHTML = "";
      blogState.articles.forEach((item, index) => {
        const id = item.id || `member-${index + 1}`;
        item.id = id;
        const tr = document.createElement("tr");
        tr.className = "hover:bg-collegiate-purpleLight/70 active:bg-collegiate-purpleLight transition-colors cursor-pointer";
        tr.innerHTML = `
          <td class="text-center font-medium text-zinc-700">${escapeHtml(item.date)}</td>
          <td class="text-center font-bold text-zinc-900">${escapeHtml(item.name)}</td>
          <td class="text-center">
            <a href="#${encodeURIComponent(id)}" class="text-collegiate-purple underline underline-offset-4 decoration-collegiate-purple/60 font-bold">${escapeHtml(item.title)}</a>
          </td>
        `;
        tr.addEventListener("click", (e) => {
          e.preventDefault();
          location.hash = encodeURIComponent(id);
        });
        tbody.appendChild(tr);
      });

      handleRoute();
    }

    function showArticle(id) {
      const idx = blogState.articles.findIndex((a) => a.id === id);
      if (idx === -1) {
        showIndex();
        return;
      }
      const item = blogState.articles[idx];
      document.getElementById("detail-date").textContent = formatFullDate(item.date);
      document.getElementById("detail-title").textContent = `「${item.title}」（${item.name}）`;

      const photoWrapper = document.getElementById("detail-photo-wrapper");
      const photoImg = document.getElementById("detail-photo");
      if (item.photo) {
        photoWrapper.classList.remove("hidden");
        photoImg.src = item.photo;
        photoImg.onerror = () => photoWrapper.classList.add("hidden");
      } else {
        photoWrapper.classList.add("hidden");
      }

      const bodyContainer = document.getElementById("detail-body");
      bodyContainer.innerHTML = "";
      const paragraphs = String(item.body || "").trim().split(/\n\s*\n/);
      paragraphs.forEach((para, pIdx) => {
        const p = document.createElement("p");
        if (pIdx === paragraphs.length - 1 && para.length < 30) p.className = "!mt-8 !mb-2 font-bold text-zinc-950";
        para.split("\n").forEach((line, lIdx) => {
          if (lIdx > 0) p.appendChild(document.createElement("br"));
          p.appendChild(document.createTextNode(line));
        });
        bodyContainer.appendChild(p);
      });

      const prevBtn = document.getElementById("prev-article-btn");
      const nextBtn = document.getElementById("next-article-btn");
      if (idx > 0) {
        const prev = blogState.articles[idx - 1];
        prevBtn.disabled = false;
        prevBtn.textContent = `← ${prev.name}「${prev.title}」`;
        prevBtn.onclick = () => { location.hash = encodeURIComponent(prev.id); };
      } else {
        prevBtn.disabled = true;
        prevBtn.textContent = "← 最初の記事です";
      }
      if (idx < blogState.articles.length - 1) {
        const next = blogState.articles[idx + 1];
        nextBtn.disabled = false;
        nextBtn.textContent = `${next.name}「${next.title}」 →`;
        nextBtn.onclick = () => { location.hash = encodeURIComponent(next.id); };
      } else {
        nextBtn.disabled = true;
        nextBtn.textContent = "最新の記事です →";
      }

      document.getElementById("index-view").classList.add("hidden");
      document.getElementById("article-view").classList.remove("hidden");
      const headerBack = document.getElementById("header-back-btn");
      headerBack.classList.remove("hidden");
      headerBack.classList.add("inline-flex");
      document.title = `「${item.title}」（${item.name}） | KOMAZAWA UNIV. MAGPIES`;
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function showIndex() {
      document.getElementById("article-view").classList.add("hidden");
      document.getElementById("index-view").classList.remove("hidden");
      const headerBack = document.getElementById("header-back-btn");
      headerBack.classList.add("hidden");
      headerBack.classList.remove("inline-flex");
      document.title = "2026年度ブログリレー | KOMAZAWA UNIV. MAGPIES";
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function handleRoute() {
      const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
      if (hash && hash !== "page-top") showArticle(hash);
      else showIndex();
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const goHome = (e) => {
        e.preventDefault();
        history.pushState("", document.title, window.location.pathname + window.location.search);
        showIndex();
      };
      document.getElementById("header-home-link").addEventListener("click", goHome);
      document.getElementById("header-back-btn").addEventListener("click", goHome);
      document.getElementById("bottom-back-btn").addEventListener("click", goHome);
      window.addEventListener("hashchange", handleRoute);

      try {
        const res = await fetch(`./data.json?t=${Date.now()}`, { cache: "no-store" });
        if (res.ok) {
          const json = await res.json();
          if (json && Array.isArray(json.articles)) {
            blogState = json;
          }
        }
      } catch (e) {}
      renderAll();
    });
  </script>
</body>
